<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake Game</title>
    <style>
        :root {
            --bg: #0b1020;
            --bg-soft: #111827;
            --panel: #1f2937;
            --panel-border: #334155;
            --text: #e5e7eb;
            --muted: #9ca3af;
            --primary: #22c55e;
            --primary-dark: #16a34a;
            --food: #f97316;
            --danger: #ef4444;
            --board: #0f172a;
            --board-cell: rgba(148, 163, 184, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at top, #172033 0%, var(--bg) 50%);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        .game-shell {
            width: min(90vw, 540px);
            background: rgba(17, 24, 39, 0.9);
            border: 1px solid var(--panel-border);
            border-radius: 18px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
            padding: 20px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.8rem, 5vw, 2.5rem);
        }

        .score-panel {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .score-box {
            min-width: 120px;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            padding: 10px 14px;
            text-align: center;
        }

        .score-label {
            display: block;
            font-size: 0.75rem;
            color: var(--muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .score-value {
            display: block;
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 4px;
        }

        .board-wrap {
            position: relative;
        }

        .board {
            width: 100%;
            aspect-ratio: 1;
            display: grid;
            grid-template-columns: repeat(18, 1fr);
            background: var(--board);
            border: 2px solid var(--panel-border);
            border-radius: 12px;
            overflow: hidden;
        }

        .cell {
            background: var(--board-cell);
            border: 1px solid rgba(148, 163, 184, 0.05);
        }

        .cell.snake {
            background: var(--primary);
            border-radius: 4px;
        }

        .cell.food {
            background: var(--food);
            border-radius: 50%;
            box-shadow: inset 0 0 0 2px rgba(255,255,255,0.2);
        }

        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 18px;
        }

        .controls {
            color: var(--muted);
            font-size: 0.95rem;
        }

        button {
            background: var(--primary);
            color: #03140b;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            padding: 10px 16px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        button:hover {
            background: var(--primary-dark);
        }

        button:active {
            transform: translateY(1px);
        }

        .overlay {
            position: absolute;
            inset: 0;
            display: none;
            place-items: center;
            background: rgba(2, 6, 23, 0.6);
            border-radius: 12px;
            text-align: center;
            padding: 16px;
        }

        .overlay.visible {
            display: grid;
        }

        .overlay-box {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 20px 24px;
            max-width: 260px;
        }

        .overlay-box h2 {
            margin: 0 0 12px;
            color: var(--danger);
        }

        .overlay-box p {
            margin: 0 0 16px;
            color: var(--text);
        }

        @media (max-width: 520px) {
            .game-shell {
                padding: 14px;
            }

            .topbar,
            .hud {
                flex-direction: column;
                align-items: stretch;
            }

            .score-panel {
                justify-content: space-between;
            }

            .score-box {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <div class="game-shell">
        <div class="topbar">
            <h1>Snake</h1>
            <button id="startBtn" type="button">Start / Restart</button>
        </div>

        <div class="score-panel">
            <div class="score-box">
                <span class="score-label">Score</span>
                <span id="score" class="score-value">0</span>
            </div>
            <div class="score-box">
                <span class="score-label">Best</span>
                <span id="bestScore" class="score-value">0</span>
            </div>
        </div>

        <div class="board-wrap">
            <div id="board" class="board" aria-label="Snake game board"></div>
            <div id="overlay" class="overlay" aria-live="polite">
                <div class="overlay-box">
                    <h2 id="overlayTitle">Game Over</h2>
                    <p id="overlayText">Press start to play again.</p>
                    <button id="overlayBtn" type="button">Play Again</button>
                </div>
            </div>
        </div>

        <div class="hud">
            <div class="controls">Use Arrow Keys or WASD</div>
            <div class="controls">Avoid walls and yourself</div>
        </div>
    </div>

    <script>
        const boardSize = 18;
        const board = document.getElementById('board');
        const scoreEl = document.getElementById('score');
        const bestScoreEl = document.getElementById('bestScore');
        const startBtn = document.getElementById('startBtn');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayText = document.getElementById('overlayText');
        const overlayBtn = document.getElementById('overlayBtn');

        let snake = [];
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let food = { x: 0, y: 0 };
        let score = 0;
        let bestScore = Number(localStorage.getItem('snake-best-score') || 0);
        let gameLoopId = null;
        let isRunning = false;
        let isGameOver = false;

        function initBoard() {
            board.innerHTML = '';
            for (let i = 0; i < boardSize * boardSize; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                board.appendChild(cell);
            }
        }

        function updateBestScore() {
            bestScoreEl.textContent = bestScore;
        }

        function updateScore() {
            scoreEl.textContent = score;
        }

        function createInitialSnake() {
            const startX = 9;
            const startY = 9;
            snake = [
                { x: startX, y: startY },
                { x: startX - 1, y: startY },
                { x: startX - 2, y: startY }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
        }

        function randomFoodPosition() {
            let candidate;
            do {
                candidate = {
                    x: Math.floor(Math.random() * boardSize),
                    y: Math.floor(Math.random() * boardSize)
                };
            } while (snake.some(segment => segment.x === candidate.x && segment.y === candidate.y));
            food = candidate;
        }

        function drawBoard() {
            const cells = board.children;
            for (let i = 0; i < cells.length; i++) {
                cells[i].classList.remove('snake', 'food');
            }

            snake.forEach(segment => {
                const index = segment.y * boardSize + segment.x;
                if (cells[index]) {
                    cells[index].classList.add('snake');
                }
            });

            const foodIndex = food.y * boardSize + food.x;
            if (cells[foodIndex]) {
                cells[foodIndex].classList.add('food');
            }
        }

        function checkFoodCollision() {
            const head = snake[0];
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                updateScore();
                if (score > bestScore) {
                    bestScore = score;
                    localStorage.setItem('snake-best-score', String(bestScore));
                    updateBestScore();
                }
                randomFoodPosition();
            } else {
                snake.pop();
            }
        }

        function checkCollision(head) {
            const wallHit = head.x < 0 || head.x >= boardSize || head.y < 0 || head.y >= boardSize;
            const selfHit = snake.some((segment, index) => index !== 0 && segment.x === head.x && segment.y === head.y);
            return wallHit || selfHit;
        }

        function tick() {
            if (!isRunning || isGameOver) {
                return;
            }

            direction = nextDirection;
            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };

            snake.unshift(head);
            checkFoodCollision();

            if (checkCollision(head)) {
                endGame();
                return;
            }

            drawBoard();
        }

        function endGame() {
            isRunning = false;
            isGameOver = true;
            clearInterval(gameLoopId);
            overlayTitle.textContent = 'Game Over';
            overlayText.textContent = `Final score: ${score}`;
            overlay.classList.add('visible');
        }

        function startGame() {
            createInitialSnake();
            score = 0;
            updateScore();
            randomFoodPosition();
            drawBoard();
            isGameOver = false;
            isRunning = true;
            overlay.classList.remove('visible');
            clearInterval(gameLoopId);
            gameLoopId = setInterval(tick, 140);
        }

        function handleDirectionChange(newDirection) {
            const isOpposite = newDirection.x === -direction.x && newDirection.y === -direction.y;
            if (!isOpposite) {
                nextDirection = newDirection;
            }
        }

        document.addEventListener('keydown', (event) => {
            const key = event.key.toLowerCase();
            if (key === 'arrowup' || key === 'w') {
                handleDirectionChange({ x: 0, y: -1 });
            } else if (key === 'arrowdown' || key === 's') {
                handleDirectionChange({ x: 0, y: 1 });
            } else if (key === 'arrowleft' || key === 'a') {
                handleDirectionChange({ x: -1, y: 0 });
            } else if (key === 'arrowright' || key === 'd') {
                handleDirectionChange({ x: 1, y: 0 });
            }
        });

        startBtn.addEventListener('click', startGame);
        overlayBtn.addEventListener('click', startGame);

        updateBestScore();
        initBoard();
        startGame();
    </script>
</body>
</html>
